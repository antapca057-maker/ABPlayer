plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.abplayer.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.abplayer.app"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "ABPlayer-v${variant.versionName}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.exoplayer:exoplayer:2.18.7'
    implementation 'androidx.media:media:1.6.0'

    // Корутины — для фонового сканирования библиотеки в LibraryActivity
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // lifecycleScope / Job — привязка корутин к жизненному циклу Activity
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}